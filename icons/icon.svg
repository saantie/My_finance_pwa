<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- Background: cream paper -->
  <rect width="512" height="512" rx="96" fill="#fdf9f0"/>

  <!-- Decorative washi-tape ที่มุม -->
  <rect x="60" y="80" width="120" height="32" rx="2" fill="#c89368" opacity="0.3" transform="rotate(-3 120 96)"/>

  <!-- ฿ glyph -->
  <text x="256" y="320"
        text-anchor="middle"
        font-family="Sarabun, sans-serif"
        font-size="220"
        font-weight="700"
        fill="#e88563">฿</text>

  <!-- หมวดหมู่ underline (terracotta wave) -->
  <path d="M120 380 Q 200 360, 280 380 T 392 380"
        stroke="#e88563"
        stroke-width="6"
        stroke-linecap="round"
        fill="none"
        opacity="0.7"/>

  <!-- Subtitle -->
  <text x="256" y="430"
        text-anchor="middle"
        font-family="Sarabun, sans-serif"
        font-size="36"
        font-weight="500"
        fill="#7a6a5c">บันทึก</text>
</svg>
