<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#fdf9f0">
  <meta name="description" content="แอปบันทึกการเงินส่วนตัว — diary mode">

  <title>บันทึกการเงิน</title>

  <!-- PWA manifest -->
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" type="image/svg+xml" href="icons/icon.svg">
  <link rel="apple-touch-icon" href="icons/icon.svg">

  <!-- Stylesheet -->
  <link rel="stylesheet" href="css/styles.css">

  <!-- Google Fonts: Sarabun (body) + Mali (heading - น่ารัก) + Cormorant Garamond (italic caption) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;500;600;700&family=Mali:wght@400;500;600;700&family=Cormorant+Garamond:ital,wght@0,400;0,500;1,400&display=swap" rel="stylesheet">
</head>
<body>

<!--
  โครงสร้างหลัก:
  - <main id="view"> = content ของ view ปัจจุบัน (render โดย views.js)
  - <nav class="bottom-nav"> = แถบ navigation 4 ปุ่ม + FAB ตรงกลาง
  - <div id="add-modal"> = modal overlay สำหรับบันทึกใหม่
  - <div id="toast"> = แถบแจ้งเตือนชั่วคราว
-->

<div id="app">

  <!-- Active view container — render ทับด้วย JS -->
  <main id="view"></main>

  <!-- Bottom navigation: 4 tabs + FAB ตรงกลาง -->
  <nav class="bottom-nav">
    <button class="nav-item active" data-view="dashboard" type="button" aria-label="วันนี้">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M3 11l9-8 9 8v10a1 1 0 01-1 1h-5v-7h-6v7H4a1 1 0 01-1-1V11z"/></svg>
      <span>วันนี้</span>
    </button>
    <button class="nav-item" data-view="list" type="button" aria-label="บันทึก">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M3 6h18M3 12h18M3 18h18"/></svg>
      <span>บันทึก</span>
    </button>

    <!-- FAB ตรงกลาง — เปิด add modal -->
    <div class="fab-wrap">
      <button id="fab" class="fab" type="button" aria-label="บันทึกใหม่">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M12 5v14M5 12h14" stroke-linecap="round"/></svg>
      </button>
    </div>

    <button class="nav-item" data-view="import" type="button" aria-label="นำเข้า">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M14 3H6a2 2 0 00-2 2v14a2 2 0 002 2h12a2 2 0 002-2V9z"/><path d="M14 3v6h6"/><path d="M9 16l3-3 3 3M12 13v8"/></svg>
      <span>นำเข้า</span>
    </button>
    <button class="nav-item" data-view="settings" type="button" aria-label="ตั้งค่า">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><circle cx="12" cy="12" r="3"/><path d="M19 12c0 .7-.1 1.4-.2 2l2 1.6-2 3.4-2.4-1a7 7 0 01-3.5 2L12.5 22h-4l-.4-2a7 7 0 01-3.5-2l-2.4 1-2-3.4 2-1.6c-.1-.6-.2-1.3-.2-2s.1-1.4.2-2l-2-1.6 2-3.4 2.4 1a7 7 0 013.5-2L8.5 2h4l.4 2a7 7 0 013.5 2l2.4-1 2 3.4-2 1.6c.1.6.2 1.3.2 2z"/></svg>
      <span>ตั้งค่า</span>
    </button>
  </nav>

  <!-- Add modal — full-screen overlay เมื่อกด FAB -->
  <div id="add-modal" class="modal hidden" role="dialog" aria-modal="true" aria-labelledby="add-modal-title"></div>

  <!-- Toast container — แสดง notification ชั่วคราว -->
  <div id="toast"></div>

</div>

<!-- Entry script: ES modules ทำให้ split file ได้สะอาด -->
<script type="module" src="js/app.js"></script>

</body>
</html>
